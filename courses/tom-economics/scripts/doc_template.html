<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>__TITLE__</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    color-scheme: light;
    --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted:#898781;
    --blue:#2a78d6; --orange:#eb6834; --border:rgba(11,11,11,0.12); --grid:#e1e0d9;
    --warn-bg:#fdf1de; --warn-border:#eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --blue:#3987e5; --orange:#d95926; --border:rgba(255,255,255,0.14); --grid:#2c2c2a;
      --warn-bg:#2a2117; --warn-border:#d95926; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    margin: 0; padding: 40px 24px 80px;
  }
  .doc { max-width: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 40px 48px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  h2 { font-size: 17px; margin: 32px 0 12px; color: var(--blue); border-bottom: 1px solid var(--grid); padding-bottom: 6px; }
  h3 { font-size: 15px; margin: 20px 0 8px; }
  p, li { font-size: 15px; line-height: 1.65; color: var(--ink); }
  strong { color: var(--ink); }
  .kicker { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0 20px; font-size: 14px; }
  th, td { border: 1px solid var(--grid); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--grid); font-weight: 600; }
  code { background: var(--grid); padding: 1px 6px; border-radius: 4px; font-size: 13px; }
  hr { border: none; border-top: 1px solid var(--grid); margin: 28px 0; }
  .tutor-box { background: var(--warn-bg); border-left: 4px solid var(--warn-border); border-radius: 8px; padding: 4px 24px 20px; margin-top: 20px; }
  .tutor-box h2 { color: var(--orange); }
  .print-btn {
    display: inline-block; margin-bottom: 20px; border: 1px solid var(--border); background: var(--surface);
    color: var(--ink); border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
  @media print { .print-btn { display: none; } body { background: white; } .doc { border: none; box-shadow: none; } }
</style>
</head>
<body>
<div class="doc">
<button class="print-btn" onclick="window.print()">🖨️ Print</button>
__BODY__
</div>
</body>
</html>
