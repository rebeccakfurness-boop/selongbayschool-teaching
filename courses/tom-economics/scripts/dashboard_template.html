<title>Tom — IGCSE Economics 0455</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-blue:    #2a78d6;
    --series-orange:  #eb6834;
    --series-aqua:    #1baf7a;
    --series-yellow:  #eda100;
    --series-magenta: #e87ba4;
    --status-good:    #0ca30c;
    --status-good-text: #006300;
    --status-warning: #fab219;
    --status-warning-text: #7a5200;
    --seq-track:      #e1e0d9;
    --card-shadow:    0 1px 2px rgba(11,11,11,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-blue:    #3987e5;
      --series-orange:  #d95926;
      --series-aqua:    #199e70;
      --series-yellow:  #c98500;
      --series-magenta: #d55181;
      --status-good:    #0ca30c;
      --status-good-text: #6bdc6b;
      --status-warning: #fab219;
      --status-warning-text: #f5c264;
      --seq-track:      #2c2c2a;
      --card-shadow:    0 1px 2px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-blue:    #3987e5;
    --series-orange:  #d95926;
    --series-aqua:    #199e70;
    --series-yellow:  #c98500;
    --series-magenta: #d55181;
    --status-good:    #0ca30c;
    --status-good-text: #6bdc6b;
    --status-warning: #fab219;
    --status-warning-text: #f5c264;
    --seq-track:      #2c2c2a;
    --card-shadow:    0 1px 2px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  header .sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .theme-btn {
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  nav.tabs {
    display: flex;
    gap: 4px;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    background: var(--page);
  }
  nav.tabs button {
    border: none;
    background: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--text-secondary);
    padding: 12px 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: var(--text-primary); border-bottom-color: var(--series-blue); font-weight: 600; }
  main { padding: 24px 28px 60px; max-width: 1080px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: var(--card-shadow);
  }
  .stat-tile .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .stat-tile .value {
    font-size: 26px;
    font-weight: 600;
    line-height: 1.1;
    font-variant-numeric: proportional-nums;
  }
  .stat-tile .value.small { font-size: 16px; font-weight: 600; }
  .stat-tile .foot { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .meter-track {
    background: var(--seq-track);
    border-radius: 20px;
    height: 8px;
    overflow: hidden;
    margin-top: 10px;
  }
  .meter-fill {
    height: 100%;
    background: var(--series-blue);
    border-radius: 20px;
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 20px;
    box-shadow: var(--card-shadow);
  }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card .muted { color: var(--text-secondary); font-size: 13px; }
  .up-next-topic { font-size: 21px; font-weight: 600; margin: 10px 0 2px; }
  .up-next-date { font-size: 13px; color: var(--text-secondary); }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    text-decoration: none;
  }
  .btn-primary { background: var(--series-blue); color: white; border-color: transparent; }
  .btn-secondary { background: var(--surface-1); color: var(--text-primary); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .pill-content   { background: color-mix(in srgb, var(--series-blue) 16%, transparent); color: var(--series-blue); }
  .pill-review    { background: color-mix(in srgb, var(--series-aqua) 16%, transparent); color: var(--series-aqua); }
  .pill-revision  { background: color-mix(in srgb, var(--series-orange) 16%, transparent); color: var(--series-orange); }
  .pill-exam-skill{ background: color-mix(in srgb, var(--series-magenta) 20%, transparent); color: var(--series-magenta); }
  .pill-past-paper{ background: color-mix(in srgb, var(--series-yellow) 20%, transparent); color: var(--series-yellow); }
  .pill-buffer    { background: var(--grid); color: var(--text-secondary); }
  .pill-good      { background: color-mix(in srgb, var(--status-good) 16%, transparent); color: var(--status-good-text); }
  .pill-warning   { background: color-mix(in srgb, var(--status-warning) 24%, transparent); color: var(--status-warning-text); }

  table.seq { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.seq th {
    text-align: left;
    padding: 8px 10px;
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface-1);
  }
  table.seq td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  table.seq tr.done td { color: var(--text-muted); }
  table.seq tr.done .title { text-decoration: line-through; }
  table.seq tr:hover td { background: color-mix(in srgb, var(--series-blue) 4%, transparent); }
  table.seq tr.current td { background: color-mix(in srgb, var(--series-blue) 8%, transparent); }
  .row-actions { display: flex; gap: 6px; }
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .icon-btn.on { background: var(--status-good); color: white; border-color: transparent; }
  .icon-btn.warn-on { background: var(--status-warning); color: #4a3300; border-color: transparent; }
  .muted-link { color: var(--text-muted); font-size: 12px; }
  a.mat-link { color: var(--series-blue); font-size: 12px; text-decoration: none; }
  a.mat-link:hover { text-decoration: underline; }

  .topic-block { margin-bottom: 18px; }
  .topic-block h3 { font-size: 14px; margin: 0 0 8px; }
  .sub-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
  .sub-row:last-child { border-bottom: none; }
  .sub-row .name { color: var(--text-primary); }
  .sub-row .ref { color: var(--text-muted); margin-right: 8px; font-variant-numeric: tabular-nums; }

  .empty { color: var(--text-muted); font-size: 13px; padding: 10px 0; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-row button {
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .filter-row button.active { background: var(--series-blue); color: white; border-color: transparent; }

  @media (max-width: 720px) {
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    main { padding: 16px; }
    header { padding: 16px; }
  }
</style>

<header>
  <div>
    <h1>Tom — Cambridge IGCSE Economics 0455</h1>
    <div class="sub">Targeting the June 2027 exam series</div>
  </div>
  <button class="theme-btn" id="themeToggle">🌓 Toggle theme</button>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-view="home">Home</button>
  <button class="tab-btn" data-view="sequence">Full sequence</button>
  <button class="tab-btn" data-view="syllabus">Syllabus map</button>
</nav>

<main>
  <section id="view-home" class="view active"></section>
  <section id="view-sequence" class="view"></section>
  <section id="view-syllabus" class="view"></section>
</main>

<script id="calendar-data" type="application/json">__CALENDAR_JSON__</script>
<script id="syllabus-data" type="application/json">__SYLLABUS_JSON__</script>
<script id="lessons-data" type="application/json">__LESSONS_JSON__</script>

<script>
const CALENDAR = JSON.parse(document.getElementById('calendar-data').textContent);
const SYLLABUS = JSON.parse(document.getElementById('syllabus-data').textContent);
const LESSONS = JSON.parse(document.getElementById('lessons-data').textContent).lessons;
const STORAGE_KEY = 'tom-economics-progress-v1';

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { done: {}, reteach: {} };
}
function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
let progress = loadProgress();

function isDone(n) { return !!progress.done[n]; }
function isReteach(n) { return !!progress.reteach[n]; }
function toggleDone(n) {
  progress.done[n] = !progress.done[n];
  saveProgress(progress);
  renderAll();
}
function toggleReteach(n) {
  progress.reteach[n] = !progress.reteach[n];
  saveProgress(progress);
  renderAll();
}

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function contentLessons() {
  return LESSONS.filter(l => l.phase === 'content' || l.phase === 'review');
}
function nextLesson() {
  return LESSONS.find(l => !isDone(l.lesson));
}
function reteachList() {
  return LESSONS.filter(l => isReteach(l.lesson));
}
function pillClass(phase) {
  return {
    content: 'pill-content', review: 'pill-review', revision: 'pill-revision',
    'exam-skill': 'pill-exam-skill', 'past-paper': 'pill-past-paper', buffer: 'pill-buffer'
  }[phase] || 'pill-buffer';
}
function phaseLabel(phase) {
  return {
    content: 'Content', review: 'Review', revision: 'Revision',
    'exam-skill': 'Exam skill', 'past-paper': 'Past paper', buffer: 'Buffer'
  }[phase] || phase;
}

// Builds the "Open guide / Worksheet (+Word) / Slides (+PowerPoint) / Flashcards" buttons
// for the Up Next card. Word/PowerPoint only appear as a small secondary link when generated.
function homeMaterialButtons(l) {
  const f = l.files || {};
  const parts = [];
  if (f.guide_html) parts.push(`<a class="btn btn-secondary" href="${l.folder}/guide.html" target="_blank">📘 Open guide</a>`);
  if (f.worksheet_html) {
    const docx = f.worksheet_docx ? ` <a class="mat-link" href="${l.folder}/worksheet.docx" target="_blank">(.docx)</a>` : '';
    parts.push(`<span class="btn btn-secondary"><a href="${l.folder}/worksheet.html" target="_blank" style="text-decoration:none;color:inherit;">📝 Worksheet</a>${docx}</span>`);
  }
  if (f.slides_html) {
    const pptx = f.slides_pptx ? ` <a class="mat-link" href="${l.folder}/slides.pptx" target="_blank">(.pptx)</a>` : '';
    parts.push(`<span class="btn btn-secondary"><a href="${l.folder}/slides.html" target="_blank" style="text-decoration:none;color:inherit;">🖥️ Slides</a>${pptx}</span>`);
  }
  if (f.flashcards) parts.push(`<a class="btn btn-secondary" href="${l.folder}/flashcards.txt" target="_blank">🃏 Flashcards</a>`);
  return parts.join('\n');
}

// Compact "guide · worksheet (docx) · slides (pptx) · cards" line for the Full Sequence table.
function seqMaterialLinks(l) {
  const f = l.files || {};
  if (!f.guide_html) return `<span class="muted-link">not generated</span>`;
  const bits = [];
  bits.push(`<a class="mat-link" href="${l.folder}/guide.html" target="_blank">guide</a>`);
  if (f.worksheet_html) {
    const docx = f.worksheet_docx ? ` / <a class="mat-link" href="${l.folder}/worksheet.docx" target="_blank">docx</a>` : '';
    bits.push(`<a class="mat-link" href="${l.folder}/worksheet.html" target="_blank">worksheet</a>${docx}`);
  }
  if (f.slides_html) {
    const pptx = f.slides_pptx ? ` / <a class="mat-link" href="${l.folder}/slides.pptx" target="_blank">pptx</a>` : '';
    bits.push(`<a class="mat-link" href="${l.folder}/slides.html" target="_blank">slides</a>${pptx}`);
  }
  if (f.flashcards) bits.push(`<a class="mat-link" href="${l.folder}/flashcards.txt" target="_blank">cards</a>`);
  return bits.join(' · ');
}

function renderHome() {
  const el = document.getElementById('view-home');
  const cl = contentLessons();
  const doneContent = cl.filter(l => isDone(l.lesson)).length;
  const pct = cl.length ? Math.round((doneContent / cl.length) * 100) : 0;
  const nl = nextLesson();
  const rt = reteachList();
  const doneTotal = LESSONS.filter(l => isDone(l.lesson)).length;

  el.innerHTML = `
    <div class="stat-row">
      <div class="stat-tile">
        <div class="label">Current / next lesson</div>
        <div class="value">${nl ? '#' + nl.lesson : '🎉'}</div>
        <div class="foot">${nl ? nl.title : 'All lessons complete'}</div>
      </div>
      <div class="stat-tile">
        <div class="label">Syllabus covered</div>
        <div class="value">${pct}%</div>
        <div class="meter-track"><div class="meter-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="stat-tile">
        <div class="label">Next session date</div>
        <div class="value small">${nl ? fmtDate(nl.date) : '—'}</div>
        <div class="foot">${nl ? phaseLabel(nl.phase) + ' · ' + nl.syllabus_ref : ''}</div>
      </div>
      <div class="stat-tile">
        <div class="label">Flagged for re-teach</div>
        <div class="value">${rt.length}</div>
        <div class="foot">${rt.length ? rt.map(l => '#' + l.lesson).join(', ') : 'None right now'}</div>
      </div>
    </div>

    <div class="card">
      <h2>Up next</h2>
      <div class="muted">Lesson ${nl ? nl.lesson : '—'} of ${LESSONS.length} · ${nl ? nl.syllabus_ref : ''}</div>
      <div class="up-next-topic">${nl ? nl.title : 'You are fully up to date 🎉'}</div>
      <div class="up-next-date">${nl ? fmtDate(nl.date) + ' · ' + phaseLabel(nl.phase) : ''}</div>
      <div class="btn-row">
        ${nl && nl.materials_generated ? homeMaterialButtons(nl) :
        nl ? `<span class="muted-link">Materials not generated yet — ask Claude Code: "plan lesson ${nl.lesson}"</span>` : ''}
      </div>
      ${nl ? `<div class="btn-row"><button class="btn btn-primary" onclick="toggleDone(${nl.lesson})">✓ Mark done & advance</button></div>` : ''}
    </div>

    ${rt.length ? `<div class="card">
      <h2>Needs a re-teach</h2>
      <div class="muted">Flagged from the Full sequence view</div>
      ${rt.map(l => `<div class="sub-row"><span><span class="ref">#${l.lesson}</span>${l.title}</span><a class="mat-link" href="${l.folder}/guide.html" target="_blank">Open guide →</a></div>`).join('')}
    </div>` : ''}

    <div class="card">
      <h2>Course snapshot</h2>
      <div class="muted">${doneTotal} of ${LESSONS.length} lessons marked done overall (content, revision, exam skills & past papers combined)</div>
    </div>
  `;
}

let seqFilter = 'all';
function renderSequence() {
  const el = document.getElementById('view-sequence');
  const phases = ['all','content','review','revision','exam-skill','past-paper','buffer'];
  const filtered = seqFilter === 'all' ? LESSONS : LESSONS.filter(l => l.phase === seqFilter);
  const nl = nextLesson();
  el.innerHTML = `
    <div class="card">
      <div class="filter-row">
        ${phases.map(p => `<button class="${seqFilter===p?'active':''}" onclick="setSeqFilter('${p}')">${p==='all'?'All':phaseLabel(p)}</button>`).join('')}
      </div>
      <div style="overflow-x:auto;">
      <table class="seq">
        <thead><tr><th>#</th><th>Date</th><th>Phase</th><th>Ref</th><th>Title</th><th>Materials</th><th>Status</th></tr></thead>
        <tbody>
        ${filtered.map(l => `
          <tr class="${isDone(l.lesson)?'done':''} ${nl && nl.lesson===l.lesson?'current':''}">
            <td>${l.lesson}</td>
            <td>${fmtDate(l.date)}</td>
            <td><span class="pill ${pillClass(l.phase)}">${phaseLabel(l.phase)}</span></td>
            <td>${l.syllabus_ref}</td>
            <td class="title">${l.title}</td>
            <td>${seqMaterialLinks(l)}</td>
            <td>
              <div class="row-actions">
                <button class="icon-btn ${isDone(l.lesson)?'on':''}" title="Mark done" onclick="toggleDone(${l.lesson})">✓</button>
                <button class="icon-btn ${isReteach(l.lesson)?'warn-on':''}" title="Flag re-teach" onclick="toggleReteach(${l.lesson})">⚠</button>
              </div>
            </td>
          </tr>
        `).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
}
function setSeqFilter(p) { seqFilter = p; renderSequence(); }

function lessonsForSubtopic(ref) {
  return LESSONS.filter(l => l.syllabus_ref.split(/[\s\/]+/).some(r => r === ref || r.startsWith(ref)));
}

function renderSyllabus() {
  const el = document.getElementById('view-syllabus');
  el.innerHTML = `
    <div class="card">
      <div class="muted" style="margin-bottom:12px;">Cambridge ${SYLLABUS.code} · ${SYLLABUS.title} · ${SYLLABUS.exam_series}</div>
      ${SYLLABUS.topics.map(t => `
        <div class="topic-block">
          <h3>${t.id}. ${t.title}</h3>
          ${t.subtopics.map(s => {
            const covering = lessonsForSubtopic(s.id);
            const doneAny = covering.some(l => isDone(l.lesson));
            return `<div class="sub-row">
              <span><span class="ref">${s.id}</span><span class="name">${s.title}</span></span>
              <span>
                ${s.known ? '<span class="pill pill-good">✓ Already known</span>' :
                  doneAny ? '<span class="pill pill-good">✓ Taught</span>' :
                  covering.length ? `<span class="muted-link">Lesson ${covering.map(l=>l.lesson).join(', ')}</span>` : ''}
              </span>
            </div>`;
          }).join('')}
        </div>
      `).join('')}
    </div>
  `;
}

function renderAll() { renderHome(); renderSequence(); renderSyllabus(); }

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
  });
});

const themeBtn = document.getElementById('themeToggle');
function applyStoredTheme() {
  const t = localStorage.getItem('tom-economics-theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : (cur === 'light' ? null : 'dark');
  if (next) { document.documentElement.setAttribute('data-theme', next); localStorage.setItem('tom-economics-theme', next); }
  else { document.documentElement.removeAttribute('data-theme'); localStorage.removeItem('tom-economics-theme'); }
});
applyStoredTheme();

renderAll();
</script>
